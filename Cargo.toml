[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
axum-server = "0.8.0"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
test-log = "0.2.21"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "z2p"
path = "src/bin/main.rs"
