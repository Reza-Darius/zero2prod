[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
axum-server = "0.8.0"
dotenvy = "0.15.7"
envy = "0.4.2"
reqwest = "0.13.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9", features = [ "runtime-tokio", "tls-rustls-aws-lc-rs", "postgres" , "uuid"] }
test-log = "0.2.21"
testcontainers-modules = { version = "0.15.0", features = ["blocking", "postgres"] }
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
test-containers-util = { version = "0.1", features = ["pg-sqlx"], git = "https://github.com/Reza-Darius/test-containers-util.git", branch = "update/bump-to-sqlx-0.9.0" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "z2p"
path = "src/bin/main.rs"
